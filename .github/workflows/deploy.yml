# Publishes the PaddleQ club app at the address in site-url (https://paddleq.in/ after the move).
# The build uses relative paths, so the same files work at the old /pqclub/ address and at the domain root.
# The code lives in workwithvineeth/pickleq (branch club-mode); this repository only holds the published site.
# It has its own address so Android doesn't treat it as part of the PICKLEQ app at /pickleq/.
#
# club-ref (in this repository) names the exact pickleq commit to publish. To deploy a new version, change club-ref
# and push. The hourly run rebuilds that same commit only to refresh the event link-preview pages (for WhatsApp),
# so it never ships code nobody chose.
name: Build and publish PQ Club

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *' # hourly: new and changed events get their link-preview pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read which commit to publish
        uses: actions/checkout@v7
        with:
          path: site

      - name: Check out PICKLEQ at that commit
        uses: actions/checkout@v7
        with:
          repository: workwithvineeth/pickleq
          ref: club-mode
          path: club-src
          fetch-depth: 0

      - name: Switch to the pinned commit
        working-directory: club-src
        run: |
          ref=$(tr -d '[:space:]' < ../site/club-ref)
          git checkout --quiet "$ref"
          echo "Publishing $(git rev-parse --short=7 HEAD)"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test and build PQ Club
        working-directory: club-src
        env:
          VITE_BASE: ./
        run: |
          npm ci
          npm test
          npm run build:club

      - name: Event link-preview pages
        working-directory: club-src
        run: node scripts/share-pages.mjs dist/club "$(tr -d '[:space:]' < ../site/site-url)"

      - name: Organiser videos (kept in this repo, served at /media/)
        run: if [ -d site/media ]; then mkdir -p club-src/dist/club/media && cp site/media/* club-src/dist/club/media/; fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: club-src/dist/club

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

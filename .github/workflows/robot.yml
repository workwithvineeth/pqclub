# The PQ Club test robot: runs the phone tests (Android Chrome and iPhone Safari) against the live Club test site
# and the real club server, after every deploy and every night. Test code lives in pickleq (branch club-mode), folder e2e/.
name: PQ Club robot

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and publish PQ Club']
    types: [completed]
  schedule:
    - cron: '47 21 * * *' # 03:17 in India

permissions:
  contents: read
  id-token: write # proves to the club server that it's this robot (no stored secret)
  issues: write # opens one "Robot failed" issue with a short summary, closed again on the next green run

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    # After a deploy (not the hourly link-preview refresh, which rebuilds the same commit), nightly, or by hand.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read which commit is published
        uses: actions/checkout@v7
        with:
          path: site

      - name: Check out the robot (pickleq, the published commit)
        uses: actions/checkout@v7
        with:
          repository: workwithvineeth/pickleq
          ref: club-mode
          path: club-src
          fetch-depth: 0

      - name: Switch to the published commit
        working-directory: club-src
        run: git checkout --quiet "$(tr -d '[:space:]' < ../site/club-ref)"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait until the site serves this build
        if: github.event_name == 'workflow_run'
        working-directory: club-src
        run: |
          want=$(git rev-parse --short=7 HEAD)
          site=$(tr -d '[:space:]' < ../site/site-url)
          for i in $(seq 1 30); do
            js=$(curl -fsSL "$site?v=$RANDOM" | grep -o 'assets/index-[^"]*\.js' | head -1)
            if [ -n "$js" ] && curl -fsSL "$site$js" | grep -q "$want"; then echo "Site has build $want"; exit 0; fi
            sleep 20
          done
          echo "::warning::The site didn't show build $want within 10 minutes; testing what it serves now"

      - name: Old address forwards to the new one
        id: oldlinks
        continue-on-error: true
        run: |
          # Links shared before the move (github.io/pqclub/...) must land on the same page at the site address.
          site=$(tr -d '[:space:]' < site/site-url)
          old=https://workwithvineeth.github.io/pqclub/
          : > oldlinks.md
          if [ "$site" = "$old" ]; then echo "Site still on the old address; nothing to check."; exit 0; fi
          bad=0
          for path in "" "e/a6a1accf74/" "index.html"; do
            got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$old$path")
            if [ "$got" = "301 $site$path" ]; then echo "OK  $old$path → $site$path"
            else echo "- Old link $old$path should forward to $site$path, got: $got" | tee -a oldlinks.md; bad=1; fi
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${site}e/a6a1accf74/")
          [ "$code" = "200" ] || { echo "- ${site}e/a6a1accf74/ (TPC share page) answered $code" | tee -a oldlinks.md; bad=1; }
          exit $bad

      - name: Install the robot and its browsers
        working-directory: club-src/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run the robot
        id: robot
        continue-on-error: true
        working-directory: club-src/e2e
        env:
          CI: 'true'
        run: PQ_BASE=$(tr -d '[:space:]' < ../../site/site-url) npx playwright test

      - name: Keep the report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-report
          path: |
            club-src/e2e/playwright-report
            club-src/e2e/test-results
            club-src/e2e/results.json
          retention-days: 14

      - name: Short summary (and a "Robot failed" issue when it fails)
        if: always()
        working-directory: club-src/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OK: ${{ steps.robot.outcome == 'success' && steps.oldlinks.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha=$(tr -d '[:space:]' < ../../site/club-ref | cut -c1-7)
          { echo "### Robot on build $sha"; if [ -f summary.mjs ]; then node summary.mjs results.json; else echo "(summary script not in this build)"; fi; if [ -s ../../oldlinks.md ]; then echo; echo "**Old links:**"; cat ../../oldlinks.md; fi; echo; echo "Report and screenshots: $RUN_URL (Artifacts → robot-report)"; } > summary.md || true
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          num=$(gh issue list --state open --label robot --json number --jq '.[0].number' 2>/dev/null)
          if [ "$OK" = "true" ]; then
            [ -n "$num" ] && gh issue close "$num" --comment "Robot green again on build $sha." || true
          else
            gh label create robot --color B60205 2>/dev/null || true
            if [ -n "$num" ]; then gh issue comment "$num" --body-file summary.md
            else gh issue create --title "Robot failed" --label robot --body-file summary.md; fi
            exit 1
          fi
